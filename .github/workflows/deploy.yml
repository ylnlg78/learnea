name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurer Node.js (sans l'option cache qui faisait planter le script)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Installer les dépendances (on utilise 'npm install' si pas de lockfile)
      - name: Install dependencies
        run: npm install

      # 3. Compiler le projet
      - name: Build project
        run: npm run build

      # 4. Déployer sur Cloudflare Pages
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'atelier-sous-reseaux'
          directory: 'dist' # Vérifiez bien si votre dossier de build local s'appelle 'dist'
