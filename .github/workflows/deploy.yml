name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurer Node.js sur le runner GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. Installer les dépendances du projet
      - name: Install dependencies
        run: npm ci

      # 3. Compiler le projet pour générer les fichiers (remplit le dossier de build)
      - name: Build project
        run: npm run build

      # 4. Déployer le dossier généré sur Cloudflare Pages
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'atelier-sous-reseaux'
          directory: 'dist' # Modifiez 'dist' par 'build' ou 'out' si votre framework utilise un autre nom
